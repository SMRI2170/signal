name: Native Android checks

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Compose Multiplatform Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :composeApp:testAndroidHostTest :androidApp:assembleDebug :androidApp:assembleRelease :androidApp:bundleRelease

  performance:
    name: Android release performance
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x native/gradlew
      - name: Run release macrobenchmarks on an Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd native && ./gradlew --no-daemon :baselineprofile:connectedBenchmarkReleaseAndroidTest
      - name: Keep benchmark report and metric summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-performance-${{ github.sha }}
          path: |
            native/baselineprofile/build/reports/androidTests/connected/benchmarkRelease/**
            native/baselineprofile/build/outputs/connected_android_test_additional_output/benchmarkRelease/**/com.signal.app.baselineprofile-benchmarkData.json
            native/baselineprofile/build/outputs/connected_android_test_additional_output/benchmarkRelease/**/additionaltestoutput.benchmark.message_*
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish signed Android beta
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [verify, performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x native/gradlew
      - name: Validate tag and prepare private signing keystore
        working-directory: native
        env:
          SIGNAL_ANDROID_KEYSTORE_BASE64: ${{ secrets.SIGNAL_ANDROID_KEYSTORE_BASE64 }}
          SIGNAL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNAL_ANDROID_KEYSTORE_PASSWORD }}
          SIGNAL_ANDROID_KEY_ALIAS: ${{ secrets.SIGNAL_ANDROID_KEY_ALIAS }}
          SIGNAL_ANDROID_KEY_PASSWORD: ${{ secrets.SIGNAL_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Release tag must look like android-v0.2.0-beta.1."
            exit 1
          fi
          for secret_name in SIGNAL_ANDROID_KEYSTORE_BASE64 SIGNAL_ANDROID_KEYSTORE_PASSWORD SIGNAL_ANDROID_KEY_ALIAS SIGNAL_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing repository secret: ${secret_name}. See native/docs/android-beta-release.md."
              exit 1
            fi
          done
          printf '%s' "$SIGNAL_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signal-release.jks"
          chmod 600 "$RUNNER_TEMP/signal-release.jks"
          echo "SIGNAL_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/signal-release.jks" >> "$GITHUB_ENV"
          echo "SIGNAL_VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
          echo "SIGNAL_VERSION_CODE=$((GITHUB_RUN_NUMBER + 2))" >> "$GITHUB_ENV"
      - name: Build signed, minified APK and AAB
        working-directory: native
        env:
          SIGNAL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNAL_ANDROID_KEYSTORE_PASSWORD }}
          SIGNAL_ANDROID_KEY_ALIAS: ${{ secrets.SIGNAL_ANDROID_KEY_ALIAS }}
          SIGNAL_ANDROID_KEY_PASSWORD: ${{ secrets.SIGNAL_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :androidApp:assembleRelease :androidApp:bundleRelease
      - name: Verify signature and prepare release files
        working-directory: native
        run: |
          set -euo pipefail
          apk="androidApp/build/outputs/apk/release/androidApp-release.apk"
          aab="androidApp/build/outputs/bundle/release/androidApp-release.aab"
          test -s "$apk"
          test -s "$aab"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk"
          if ! unzip -Z1 "$aab" | grep -Eq '^META-INF/[^/]+\.(SF|RSA|DSA|EC)$'; then
            echo "::error::The Android App Bundle has no JAR signature entries."
            exit 1
          fi
          jarsigner -verify "$aab" >/dev/null
          mkdir -p "$RUNNER_TEMP/signal-release"
          cp "$apk" "$RUNNER_TEMP/signal-release/SIGNAL-${SIGNAL_VERSION_NAME}.apk"
          cp "$aab" "$RUNNER_TEMP/signal-release/SIGNAL-${SIGNAL_VERSION_NAME}.aab"
          (cd "$RUNNER_TEMP/signal-release" && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)
          {
            echo "SIGNAL Android beta ${SIGNAL_VERSION_NAME}"
            echo
            echo "- APK: download SIGNAL-${SIGNAL_VERSION_NAME}.apk and open it on your Android device."
            echo "- Update: install over an existing SIGNAL beta; the signing key must remain unchanged."
            echo "- Integrity: verify the download with SHA256SUMS.txt."
            echo "- Scope: beta distribution; this is not a Play Store release."
            echo "- Known limitation: this build records facts on the device/account according to the current app behavior; avoid entering sensitive information in beta feedback."
          } > "$RUNNER_TEMP/signal-release/RELEASE-NOTES.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$SIGNAL_VERSION_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "SIGNAL Android ${SIGNAL_VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/signal-release/RELEASE-NOTES.md" \
            "${release_flags[@]}" \
            "$RUNNER_TEMP/signal-release/SIGNAL-${SIGNAL_VERSION_NAME}.apk" \
            "$RUNNER_TEMP/signal-release/SIGNAL-${SIGNAL_VERSION_NAME}.aab" \
            "$RUNNER_TEMP/signal-release/SHA256SUMS.txt"
