name: Native Android checks

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Compose Multiplatform Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :composeApp:testAndroidHostTest :androidApp:assembleDebug
