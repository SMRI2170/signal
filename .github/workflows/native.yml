name: Native Android checks

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:
    inputs:
      run_physical_benchmark:
        description: Run Macrobenchmark on a configured self-hosted Android device
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Compose Multiplatform Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :composeApp:testAndroidHostTest :androidApp:assembleDebug :androidApp:assembleRelease
      - name: Reject credentials and development endpoints from APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/check-android-package-content.sh
          while IFS= read -r -d '' apk; do
            scripts/check-android-package-content.sh "$apk"
          done < <(find androidApp/build/outputs/apk -type f -name '*.apk' -print0)

  benchmark:
    name: Android Baseline Profile and viewport smoke checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - name: Generate Baseline Profile and smoke test 360dp / 430dp layouts
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 1500
          script: cd native && chmod +x gradlew && ./gradlew --no-daemon :androidApp:generateReleaseBaselineProfile --rerun-tasks -PSIGNAL_BENCHMARK_MODE=true && ./gradlew --no-daemon :macrobenchmark:connectedBenchmarkReleaseAndroidTest --rerun-tasks -PSIGNAL_BENCHMARK_MODE=true -Pandroid.testInstrumentationRunnerArguments.class=com.signal.benchmark.SignalUiSmokeTest -Pandroid.testInstrumentationRunnerArguments.additionalTestOutputDir=/sdcard/Pictures/baseline-profiles && adb shell wm size 1080x2400 && adb shell wm density 480 && ./gradlew --no-daemon :macrobenchmark:connectedBenchmarkReleaseAndroidTest --rerun-tasks -PSIGNAL_BENCHMARK_MODE=true -Pandroid.testInstrumentationRunnerArguments.class=com.signal.benchmark.SignalUiSmokeTest -Pandroid.testInstrumentationRunnerArguments.additionalTestOutputDir=/sdcard/Pictures/baseline-profiles && adb shell wm size 1290x2580 && ./gradlew --no-daemon :macrobenchmark:connectedBenchmarkReleaseAndroidTest --rerun-tasks -PSIGNAL_BENCHMARK_MODE=true -Pandroid.testInstrumentationRunnerArguments.class=com.signal.benchmark.SignalUiSmokeTest -Pandroid.testInstrumentationRunnerArguments.additionalTestOutputDir=/sdcard/Pictures/baseline-profiles && adb shell wm size reset && adb shell wm density reset
      - name: Upload Baseline Profile and viewport smoke results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-android-performance-${{ github.run_number }}
          path: |
            native/androidApp/build/outputs/**
            native/androidApp/build/generated/baselineProfiles/**
            native/androidApp/src/release/generated/baselineProfiles/**
            native/macrobenchmark/build/outputs/**
          if-no-files-found: warn

  physical-benchmark:
    name: Android Macrobenchmark on physical device
    if: github.event_name == 'workflow_dispatch' && inputs.run_physical_benchmark
    runs-on: [self-hosted, linux, android-physical]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Require one Android 14+ physical device
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t devices < <(adb devices | awk 'NR > 1 && $2 == "device" { print $1 }')
          if [[ "${#devices[@]}" -ne 1 ]]; then
            echo "::error::Connect exactly one Android physical device to this runner."
            exit 1
          fi
          serial="${devices[0]}"
          sdk="$(adb -s "$serial" shell getprop ro.build.version.sdk | tr -d '\r')"
          emulator="$(adb -s "$serial" shell getprop ro.kernel.qemu | tr -d '\r')"
          if [[ "$emulator" == "1" || ! "$sdk" =~ ^[0-9]+$ || "$sdk" -lt 34 ]]; then
            echo "::error::Macrobenchmark requires a physical Android 14+ device; runner connected SDK=$sdk emulator=$emulator."
            exit 1
          fi
      - name: Generate profile and measure startup / result flow
        working-directory: native
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :androidApp:generateReleaseBaselineProfile --rerun-tasks -PSIGNAL_BENCHMARK_MODE=true
          ./gradlew --no-daemon :macrobenchmark:connectedBenchmarkReleaseAndroidTest --rerun-tasks \
            -PSIGNAL_BENCHMARK_MODE=true \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
      - name: Upload physical-device performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-android-physical-performance-${{ github.run_number }}
          path: |
            native/androidApp/build/outputs/**
            native/androidApp/build/generated/baselineProfiles/**
            native/androidApp/src/release/generated/baselineProfiles/**
            native/macrobenchmark/build/outputs/**
          if-no-files-found: warn
