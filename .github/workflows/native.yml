name: Native Android checks

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Compose Multiplatform Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon :composeApp:testAndroidHostTest :androidApp:assembleDebug
