name: Universal repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: universal-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: SMRI2170/SMRI2170/.github/workflows/reusable-quality.yml@e2eb51b805e13d6329a0197243d4d1e54fed1018
    permissions:
      contents: read
      pull-requests: read
      actions: read
    with:
      run_security: false # Existing CI already runs Semgrep, Gitleaks and Trivy
