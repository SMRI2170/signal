name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks and Pages build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_STATIC_DEMO: "true"
      NEXT_PUBLIC_BASE_PATH: "/signal"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Detect dead code and unused dependencies
        run: npm run quality:dead-code
      - name: Detect circular dependencies
        run: npm run quality:cycles
      - name: Exclude server-only product routes from the static Pages build
        run: |
          mv src/app/api .github/pages-api
          if [ -d src/app/auth/callback ]; then mv src/app/auth/callback .github/pages-auth-callback; fi
          if [ -f src/proxy.ts ]; then mv src/proxy.ts .github/pages-proxy.ts; fi
          if [ -d src/app/relationships ]; then mv src/app/relationships .github/pages-relationships; fi
      - name: Build GitHub Pages site
        run: npm run build
      - name: Enforce JavaScript bundle budget
        run: npm run quality:bundle
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan source code
        run: >
          semgrep scan --config auto --error
          --exclude-rule kotlin.lang.security.gcm-detection.gcm-detection
          --exclude-rule java.android.security.exported_activity.exported_activity
          .

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main'
    needs: [quality, semgrep, gitleaks, trivy]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
