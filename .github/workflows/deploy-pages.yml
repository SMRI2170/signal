name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_STATIC_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exclude server-only product routes from the static demo build
        run: |
          mv src/app/api .github/pages-api
          if [ -d src/app/auth/callback ]; then mv src/app/auth/callback .github/pages-auth-callback; fi
          if [ -f src/proxy.ts ]; then mv src/proxy.ts .github/pages-proxy.ts; fi
          if [ -d src/app/relationships ]; then mv src/app/relationships .github/pages-relationships; fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
