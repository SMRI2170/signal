name: Native Android beta release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  release:
    name: Sign, verify, and publish Android beta
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate release tag and signing secrets
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#android-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must use android-vMAJOR.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository Actions secret $name is not configured."
              exit 1
            fi
          done
          printf 'SIGNAL_ANDROID_VERSION_NAME=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'SIGNAL_ANDROID_VERSION_CODE=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          signing_file="$RUNNER_TEMP/signal-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          chmod 600 "$signing_file"
          printf 'SIGNAL_ANDROID_KEYSTORE_PATH=%s\n' "$signing_file" >> "$GITHUB_ENV"
      - name: Build signed, minified APK and AAB
        working-directory: native
        env:
          SIGNAL_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SIGNAL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          SIGNAL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SIGNAL_API_BASE_URL: https://deufcadognkhymqxrejo.supabase.co/functions/v1/signal-api
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :androidApp:assembleRelease :androidApp:bundleRelease
      - name: Verify release signatures and scan package contents
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/scripts/check-android-package-content.sh
          mapfile -t apks < <(find native/androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one universal release APK; found ${#apks[@]}."
            exit 1
          fi
          aab="$(find native/androidApp/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          if [[ -z "$aab" ]]; then
            echo "::error::Release AAB was not produced."
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Android apksigner was not found in the installed SDK."
            exit 1
          fi
          "$apksigner" verify --verbose "${apks[0]}"
          jarsigner -verify "$aab"
          native/scripts/check-android-package-content.sh "${apks[0]}" "$aab"
          mkdir -p native/androidApp/build/release-dist
          cp "${apks[0]}" "$aab" native/docs/android-beta-release.md native/androidApp/build/release-dist/
          (
            cd native/androidApp/build/release-dist
            sha256sum ./*.apk ./*.aab > SHA256SUMS.txt
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="SIGNAL Android Beta $SIGNAL_ANDROID_VERSION_NAME"
          release_dir=native/androidApp/build/release-dist
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$release_dir"/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file native/docs/android-beta-release.md
          else
            gh release create "$tag" "$release_dir"/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file native/docs/android-beta-release.md
          fi
